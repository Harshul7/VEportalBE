databaseChangeLog:
  - changeSet:
      id: 045-student-course-results
      author: codex
      changes:
        - createTable:
            tableName: student_course_results
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: DATETIME, constraints: { nullable: false } }
              - column: { name: updated_at, type: DATETIME, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(120) }
              - column: { name: updated_by, type: VARCHAR(120) }
              - column: { name: student_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: course_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: group_id, type: BIGINT }
              - column: { name: evaluation_status, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: final_result, type: VARCHAR(10) }
              - column: { name: evaluator_id, type: BIGINT }
              - column: { name: publisher_id, type: BIGINT }
              - column: { name: published_at, type: DATETIME }
              - column: { name: remarks, type: VARCHAR(1000) }
        - addUniqueConstraint: { tableName: student_course_results, columnNames: student_id, course_id, constraintName: uq_student_course_result }
        - addForeignKeyConstraint: { baseTableName: student_course_results, baseColumnNames: student_id, referencedTableName: students, referencedColumnNames: id, constraintName: fk_result_student }
        - addForeignKeyConstraint: { baseTableName: student_course_results, baseColumnNames: course_id, referencedTableName: courses, referencedColumnNames: id, constraintName: fk_result_course }
        - addForeignKeyConstraint: { baseTableName: student_course_results, baseColumnNames: group_id, referencedTableName: course_groups, referencedColumnNames: id, constraintName: fk_result_group }
        - addForeignKeyConstraint: { baseTableName: student_course_results, baseColumnNames: evaluator_id, referencedTableName: users, referencedColumnNames: id, constraintName: fk_result_evaluator }
        - addForeignKeyConstraint: { baseTableName: student_course_results, baseColumnNames: publisher_id, referencedTableName: users, referencedColumnNames: id, constraintName: fk_result_publisher }
