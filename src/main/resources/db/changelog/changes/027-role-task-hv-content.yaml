databaseChangeLog:
  - changeSet:
      id: 027-role-task-hv-content
      author: veportal
      comment: Rename portal roles, add session task/document support, and seed the HV Book contents chapters.
      changes:
        - sql:
            sql: |
              UPDATE users SET role = 'GROUP_MENTOR' WHERE role = 'FACULTY';
              UPDATE users SET role = 'FACULTY_COORDINATOR' WHERE role = 'ADMIN';
        - createTable:
            tableName: session_tasks
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: session_id, type: bigint, constraints: {nullable: false}}
              - column: {name: title, type: varchar(200), constraints: {nullable: false}}
              - column: {name: task_type, type: varchar(40), constraints: {nullable: false}}
              - column: {name: description, type: varchar(4000)}
              - column: {name: due_date, type: date}
              - column: {name: status, type: varchar(20), defaultValue: ACTIVE, constraints: {nullable: false}}
              - column: {name: created_at, type: datetime(6), defaultValueComputed: CURRENT_TIMESTAMP(6), constraints: {nullable: false}}
              - column: {name: created_by, type: varchar(120)}
              - column: {name: updated_at, type: datetime(6), defaultValueComputed: CURRENT_TIMESTAMP(6), constraints: {nullable: false}}
              - column: {name: updated_by, type: varchar(120)}
        - addForeignKeyConstraint:
            baseTableName: session_tasks
            baseColumnNames: session_id
            referencedTableName: class_sessions
            referencedColumnNames: id
            constraintName: fk_session_tasks_session
            onDelete: CASCADE
        - createIndex:
            tableName: session_tasks
            indexName: idx_session_tasks_session
            columns: [{column: {name: session_id}}]
        - createTable:
            tableName: task_documents
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: task_id, type: bigint, constraints: {nullable: false}}
              - column: {name: file_name, type: varchar(255), constraints: {nullable: false}}
              - column: {name: storage_key, type: varchar(255), constraints: {nullable: false, unique: true}}
              - column: {name: content_type, type: varchar(150)}
              - column: {name: size_bytes, type: bigint, constraints: {nullable: false}}
              - column: {name: uploaded_by_id, type: bigint, constraints: {nullable: false}}
              - column: {name: uploaded_at, type: datetime(6), defaultValueComputed: CURRENT_TIMESTAMP(6), constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableName: task_documents
            baseColumnNames: task_id
            referencedTableName: session_tasks
            referencedColumnNames: id
            constraintName: fk_task_documents_task
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: task_documents
            baseColumnNames: uploaded_by_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_task_documents_uploader
        - sql:
            sql: |
              UPDATE master_chapter_templates SET title = 'Understanding Value Education', description = 'SECTION I: Introduction to Value Education. Understanding the purpose and content of value education.' WHERE course_template_id = (SELECT id FROM master_course_templates WHERE code = 'VE1') AND chapter_number = 1;
              UPDATE master_chapter_templates SET title = 'Self-exploration as the Process for Value Education', description = 'SECTION I: Introduction to Value Education. Self-exploration as a proposal to be verified through natural acceptance and experiential validation.' WHERE course_template_id = (SELECT id FROM master_course_templates WHERE code = 'VE1') AND chapter_number = 2;
              UPDATE master_chapter_templates SET title = 'The Program to Fulfil Basic Human Aspirations', description = 'SECTION I: Introduction to Value Education. Understanding the programme for continuous happiness and prosperity.' WHERE course_template_id = (SELECT id FROM master_course_templates WHERE code = 'VE1') AND chapter_number = 3;
              UPDATE master_chapter_templates SET title = 'Understanding the Human Being as Co-existence of Self (I) and Body', description = 'SECTION II: Understanding harmony at various levels. The human being as the co-existence of the self and the body.' WHERE course_template_id = (SELECT id FROM master_course_templates WHERE code = 'VE1') AND chapter_number = 4;
              UPDATE master_chapter_templates SET title = 'Harmony in the Self (I) - Understanding Myself', description = 'SECTION II: Understanding harmony at various levels. Harmony in the self and understanding myself.' WHERE course_template_id = (SELECT id FROM master_course_templates WHERE code = 'VE1') AND chapter_number = 5;
              UPDATE master_chapter_templates SET title = 'Harmony with the Body - Understanding Sanyama and Sv-asthya', description = 'SECTION II: Understanding harmony at various levels. Harmony with the body through sanyama and sv-asthya.' WHERE course_template_id = (SELECT id FROM master_course_templates WHERE code = 'VE1') AND chapter_number = 6;
              UPDATE master_chapter_templates SET title = 'The Basic Human Aspirations - Continuous Happiness and Prosperity', description = 'SECTION II: Understanding harmony at various levels. Continuous happiness and prosperity as basic human aspirations.' WHERE course_template_id = (SELECT id FROM master_course_templates WHERE code = 'VE1') AND chapter_number = 7;
              UPDATE master_chapter_templates SET title = 'Harmony in the Family - Understanding Values in Human Relationships', description = 'SECTION II: Understanding harmony at various levels. Values and mutual fulfilment in human relationships.' WHERE course_template_id = (SELECT id FROM master_course_templates WHERE code = 'VE1') AND chapter_number = 8;
              INSERT INTO master_chapter_templates (course_template_id, chapter_number, title, description, status) SELECT id, 4, 'Understanding the Human Being as Co-existence of Self (I) and Body', 'SECTION II: Understanding harmony at various levels. The human being as the co-existence of the self and the body.', 'ACTIVE' FROM master_course_templates t WHERE t.code = 'VE1' AND NOT EXISTS (SELECT 1 FROM master_chapter_templates m WHERE m.course_template_id = t.id AND m.chapter_number = 4);
              INSERT INTO master_chapter_templates (course_template_id, chapter_number, title, description, status) SELECT id, 5, 'Harmony in the Self (I) - Understanding Myself', 'SECTION II: Understanding harmony at various levels. Harmony in the self and understanding myself.', 'ACTIVE' FROM master_course_templates t WHERE t.code = 'VE1' AND NOT EXISTS (SELECT 1 FROM master_chapter_templates m WHERE m.course_template_id = t.id AND m.chapter_number = 5);
              INSERT INTO master_chapter_templates (course_template_id, chapter_number, title, description, status) SELECT id, 6, 'Harmony with the Body - Understanding Sanyama and Sv-asthya', 'SECTION II: Understanding harmony at various levels. Harmony with the body through sanyama and sv-asthya.', 'ACTIVE' FROM master_course_templates t WHERE t.code = 'VE1' AND NOT EXISTS (SELECT 1 FROM master_chapter_templates m WHERE m.course_template_id = t.id AND m.chapter_number = 6);
              INSERT INTO master_chapter_templates (course_template_id, chapter_number, title, description, status) SELECT id, 7, 'The Basic Human Aspirations - Continuous Happiness and Prosperity', 'SECTION II: Understanding harmony at various levels. Continuous happiness and prosperity as basic human aspirations.', 'ACTIVE' FROM master_course_templates t WHERE t.code = 'VE1' AND NOT EXISTS (SELECT 1 FROM master_chapter_templates m WHERE m.course_template_id = t.id AND m.chapter_number = 7);
              INSERT INTO master_chapter_templates (course_template_id, chapter_number, title, description, status) SELECT id, 8, 'Harmony in the Family - Understanding Values in Human Relationships', 'SECTION II: Understanding harmony at various levels. Values and mutual fulfilment in human relationships.', 'ACTIVE' FROM master_course_templates t WHERE t.code = 'VE1' AND NOT EXISTS (SELECT 1 FROM master_chapter_templates m WHERE m.course_template_id = t.id AND m.chapter_number = 8);
              INSERT INTO master_chapter_templates (course_template_id, chapter_number, title, description, status) SELECT id, 9, 'Harmony in the Society - From Family Order to World Family Order', 'SECTION II: Understanding harmony at various levels. Moving from family order towards universal human order.', 'ACTIVE' FROM master_course_templates t WHERE t.code = 'VE1' AND NOT EXISTS (SELECT 1 FROM master_chapter_templates m WHERE m.course_template_id = t.id AND m.chapter_number = 9);
              INSERT INTO master_chapter_templates (course_template_id, chapter_number, title, description, status) SELECT id, 10, 'Harmony in Nature - Understanding the Interconnectedness and Mutual Fulfilment', 'SECTION II: Understanding harmony at various levels. Interconnectedness and mutual fulfilment in nature.', 'ACTIVE' FROM master_course_templates t WHERE t.code = 'VE1' AND NOT EXISTS (SELECT 1 FROM master_chapter_templates m WHERE m.course_template_id = t.id AND m.chapter_number = 10);
              INSERT INTO master_chapter_templates (course_template_id, chapter_number, title, description, status) SELECT id, 11, 'Harmony in Existence - Understanding Existence as Co-existence', 'SECTION II: Understanding harmony at various levels. Existence understood as co-existence.', 'ACTIVE' FROM master_course_templates t WHERE t.code = 'VE1' AND NOT EXISTS (SELECT 1 FROM master_chapter_templates m WHERE m.course_template_id = t.id AND m.chapter_number = 11);
              INSERT INTO master_chapter_templates (course_template_id, chapter_number, title, description, status) SELECT id, 12, 'Providing the Basis for Universal Human Values and Ethical Human Conduct', 'SECTION III: Implications of the right understanding. Universal human values and ethical human conduct.', 'ACTIVE' FROM master_course_templates t WHERE t.code = 'VE1' AND NOT EXISTS (SELECT 1 FROM master_chapter_templates m WHERE m.course_template_id = t.id AND m.chapter_number = 12);
              INSERT INTO master_chapter_templates (course_template_id, chapter_number, title, description, status) SELECT id, 13, 'Basis for the Holistic Alternative towards Universal Human Order', 'SECTION III: Implications of the right understanding. The basis for a holistic alternative and universal human order.', 'ACTIVE' FROM master_course_templates t WHERE t.code = 'VE1' AND NOT EXISTS (SELECT 1 FROM master_chapter_templates m WHERE m.course_template_id = t.id AND m.chapter_number = 13);
              INSERT INTO master_chapter_templates (course_template_id, chapter_number, title, description, status) SELECT id, 14, 'Professional Ethics in the Light of Right Understanding', 'SECTION III: Implications of the right understanding. Professional ethics grounded in right understanding.', 'ACTIVE' FROM master_course_templates t WHERE t.code = 'VE1' AND NOT EXISTS (SELECT 1 FROM master_chapter_templates m WHERE m.course_template_id = t.id AND m.chapter_number = 14);
              INSERT INTO master_chapter_templates (course_template_id, chapter_number, title, description, status) SELECT id, 15, 'Vision for Holistic Technologies, Production Systems and Management Models', 'SECTION III: Implications of the right understanding. Holistic technologies, production systems, and management models.', 'ACTIVE' FROM master_course_templates t WHERE t.code = 'VE1' AND NOT EXISTS (SELECT 1 FROM master_chapter_templates m WHERE m.course_template_id = t.id AND m.chapter_number = 15);
              INSERT INTO master_chapter_templates (course_template_id, chapter_number, title, description, status) SELECT id, 16, 'Journey towards the Holistic Alternative - The Road Ahead', 'SECTION III: Implications of the right understanding. The road ahead towards the holistic alternative.', 'ACTIVE' FROM master_course_templates t WHERE t.code = 'VE1' AND NOT EXISTS (SELECT 1 FROM master_chapter_templates m WHERE m.course_template_id = t.id AND m.chapter_number = 16);
              INSERT INTO chapters (course_id, chapter_number, title, description, display_order, status, created_at, updated_at)
              SELECT c.id, m.chapter_number, m.title, m.description, m.chapter_number, 'ACTIVE', CURRENT_TIMESTAMP(6), CURRENT_TIMESTAMP(6)
              FROM courses c JOIN master_course_templates t ON t.code = c.course_type AND t.semester = c.semester AND t.status = 'ACTIVE'
              JOIN master_chapter_templates m ON m.course_template_id = t.id AND m.status = 'ACTIVE'
              WHERE NOT EXISTS (SELECT 1 FROM chapters existing WHERE existing.course_id = c.id AND existing.chapter_number = m.chapter_number);
      rollback:
        - dropTable: {tableName: task_documents}
        - dropTable: {tableName: session_tasks}
