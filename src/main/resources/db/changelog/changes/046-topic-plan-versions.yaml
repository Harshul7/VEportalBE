databaseChangeLog:
  - changeSet:
      id: 046-topic-plan-versions
      author: codex
      changes:
        - createTable:
            tableName: group_topic_plan_versions
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: DATETIME, constraints: { nullable: false } }
              - column: { name: updated_at, type: DATETIME, constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(120) }
              - column: { name: updated_by, type: VARCHAR(120) }
              - column: { name: group_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: version_number, type: INT, constraints: { nullable: false } }
              - column: { name: snapshot, type: VARCHAR(10000), constraints: { nullable: false } }
              - column: { name: reason, type: VARCHAR(500), constraints: { nullable: false } }
              - column: { name: author_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: created_at_override, type: DATETIME, constraints: { nullable: false } }
        - addForeignKeyConstraint: { baseTableName: group_topic_plan_versions, baseColumnNames: group_id, referencedTableName: course_groups, referencedColumnNames: id, constraintName: fk_topic_version_group }
        - addForeignKeyConstraint: { baseTableName: group_topic_plan_versions, baseColumnNames: author_id, referencedTableName: users, referencedColumnNames: id, constraintName: fk_topic_version_author }
