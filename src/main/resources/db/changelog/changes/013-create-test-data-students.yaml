databaseChangeLog:
  - changeSet:
      id: 013-create-test-data-students
      author: veportal
      comment: Table backing the DataFlowTestStudent CRUD feature. Seeded with 20 reference rows.
      changes:
        - createTable:
            tableName: test_data_students
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: student_code
                  type: varchar(30)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_test_data_students_code
              - column:
                  name: full_name
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(190)
              - column:
                  name: programme
                  type: varchar(80)
                  constraints:
                    nullable: false
              - column:
                  name: batch
                  type: varchar(20)
              - column:
                  name: gender
                  type: varchar(20)
              - column:
                  name: date_of_birth
                  type: date
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: datetime(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(120)
              - column:
                  name: updated_at
                  type: datetime(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(120)
        - createIndex:
            tableName: test_data_students
            indexName: idx_test_data_students_programme
            columns:
              - column:
                  name: programme
        - createIndex:
            tableName: test_data_students
            indexName: idx_test_data_students_batch
            columns:
              - column:
                  name: batch
        - createIndex:
            tableName: test_data_students
            indexName: idx_test_data_students_status
            columns:
              - column:
                  name: status
        - insert:
