databaseChangeLog:
  - changeSet:
      id: 002-create-courses
      author: veportal
      changes:
        - createTable:
            tableName: courses
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(40)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_courses_code
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: term
                  type: varchar(50)
              - column:
                  name: status
                  type: varchar(50)
              - column:
                  name: summary
                  type: varchar(2000)
              - column:
                  name: faculty_id
                  type: bigint
              - column:
                  name: created_at
                  type: datetime(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(120)
              - column:
                  name: updated_at
                  type: datetime(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(120)
        - addForeignKeyConstraint:
            baseTableName: courses
            baseColumnNames: faculty_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_courses_faculty
            onDelete: SET NULL
      rollback:
        - dropTable:
            tableName: courses
