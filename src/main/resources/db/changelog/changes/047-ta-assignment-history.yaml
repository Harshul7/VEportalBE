databaseChangeLog:
  - changeSet:
      id: 047-ta-assignment-history
      author: veportal
      changes:
        - createTable:
            tableName: ta_group_assignment_history
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: group_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: ta_user_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: assigned_by, type: BIGINT, constraints: {nullable: false}}
              - column: {name: assigned_at, type: DATETIME(6), constraints: {nullable: false}}
              - column: {name: ended_at, type: DATETIME(6)}
              - column: {name: reason, type: VARCHAR(500)}
              - column: {name: status, type: VARCHAR(20), defaultValue: ACTIVE, constraints: {nullable: false}}
              - column: {name: created_at, type: DATETIME(6), defaultValueComputed: CURRENT_TIMESTAMP(6), constraints: {nullable: false}}
              - column: {name: updated_at, type: DATETIME(6), defaultValueComputed: CURRENT_TIMESTAMP(6), constraints: {nullable: false}}
        - addForeignKeyConstraint: {baseTableName: ta_group_assignment_history, baseColumnNames: group_id, constraintName: fk_ta_history_group, referencedTableName: course_groups, referencedColumnNames: id}
        - addForeignKeyConstraint: {baseTableName: ta_group_assignment_history, baseColumnNames: ta_user_id, constraintName: fk_ta_history_ta, referencedTableName: users, referencedColumnNames: id}
        - addForeignKeyConstraint: {baseTableName: ta_group_assignment_history, baseColumnNames: assigned_by, constraintName: fk_ta_history_actor, referencedTableName: users, referencedColumnNames: id}
        - createIndex: {tableName: ta_group_assignment_history, indexName: idx_ta_history_group, columns: [{column: {name: group_id}}, {column: {name: assigned_at}}]}
