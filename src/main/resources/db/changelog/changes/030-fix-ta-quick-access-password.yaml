databaseChangeLog:
  - changeSet:
      id: 030-fix-ta-quick-access-password
      author: veportal
      comment: Ensure the seeded Teaching Assistant quick-access password uses a valid bcrypt hash.
      changes:
        - update:
            tableName: users
            columns:
              - column:
                  name: password_hash
                  value: '$2a$10$Et4RnBoJcVHjkQSTr5PgnecW0DR8CsjbS0PMkTYytb.dlvif3xQ7G'
            where: email = 'ta@iiit.ac.in'
