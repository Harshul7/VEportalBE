databaseChangeLog:
  - changeSet:
      id: 007-create-teaching-logs
      author: veportal
      changes:
        - createTable:
            tableName: teaching_logs
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: session_id
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: remarks
                  type: text
              - column:
                  name: updated_by_id
                  type: bigint
              - column:
                  name: created_at
                  type: datetime(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(120)
              - column:
                  name: updated_at
                  type: datetime(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(120)
        - addUniqueConstraint:
            tableName: teaching_logs
            columnNames: session_id
            constraintName: uq_teaching_logs_session
        - addForeignKeyConstraint:
            baseTableName: teaching_logs
            baseColumnNames: session_id
            referencedTableName: class_sessions
            referencedColumnNames: id
            constraintName: fk_teaching_logs_session
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: teaching_logs
            baseColumnNames: updated_by_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_teaching_logs_updated_by
            onDelete: SET NULL
      rollback:
        - dropTable:
            tableName: teaching_logs
