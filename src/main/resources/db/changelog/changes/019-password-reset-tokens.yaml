databaseChangeLog:
  - changeSet:
      id: 019-password-reset-tokens
      author: veportal
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: token_hash, type: varchar(64), constraints: { nullable: false, unique: true, uniqueConstraintName: uq_password_reset_token_hash } }
              - column: { name: expires_at, type: datetime(6), constraints: { nullable: false } }
              - column: { name: used_at, type: datetime(6) }
              - column: { name: created_at, type: datetime(6), defaultValueComputed: CURRENT_TIMESTAMP(6), constraints: { nullable: false } }
              - column: { name: created_by, type: varchar(120) }
              - column: { name: updated_at, type: datetime(6), defaultValueComputed: CURRENT_TIMESTAMP(6), constraints: { nullable: false } }
              - column: { name: updated_by, type: varchar(120) }
        - addForeignKeyConstraint:
            baseTableName: password_reset_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_password_reset_user
            onDelete: CASCADE
        - createIndex:
            tableName: password_reset_tokens
            indexName: idx_password_reset_expiry
            columns:
              - column: { name: expires_at }
