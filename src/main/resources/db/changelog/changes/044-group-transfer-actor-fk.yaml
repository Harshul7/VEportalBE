databaseChangeLog:
  - changeSet:
      id: 044-group-transfer-actor-fk
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists: { tableName: group_transfer_history }
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_group_transfer_actor
                foreignKeyTableName: group_transfer_history
      changes:
        - addForeignKeyConstraint: { baseTableName: group_transfer_history, baseColumnNames: performed_by, referencedTableName: users, referencedColumnNames: id, constraintName: fk_group_transfer_actor }
